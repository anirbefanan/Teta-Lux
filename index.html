*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090c18;color:white;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}body{background:radial-gradient(ellipse at 50% 0%,#26344d 0%,#111526 43%,#070811 100%)}.app{max-width:530px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);min-height:100dvh;display:flex;flex-direction:column;gap:12px}.top{display:flex;align-items:center;gap:9px}.brand{flex:1;min-width:0}.brand strong{font-size:20px;letter-spacing:2px}.sub{font:700 10px ui-monospace,monospace;color:var(--accent);margin-top:4px}.stat,.card,.pause{background:#ffffff12;border:1px solid #ffffff22;border-radius:14px;backdrop-filter:blur(10px)}.stat{padding:6px 9px;text-align:right;min-width:58px}.stat small,.card small{display:block;color:#aab1c4;font:700 10px ui-monospace,monospace}.stat b{font-size:15px}.pause{color:white;width:37px;height:38px;font-size:17px}.tiers{display:flex;gap:5px}.tiers button{flex:1;min-width:0;border-radius:100px;padding:9px 0;background:#ffffff10;border:1px solid #ffffff1c;color:#cbd1df;font-size:10px;font-weight:900}.tiers button.selected{background:var(--accent);color:#080b13}.arena{display:flex;gap:10px;justify-content:center;align-items:flex-start;flex:1;min-height:0}.boardwrap{width:min(calc(100% - 88px),calc((100dvh - 235px)/2));max-width:360px;align-self:flex-start}#board{display:block;width:100%;height:auto;aspect-ratio:1/2;background:#03050dc9;border:1px solid #ffffff30;border-radius:12px;box-shadow:0 0 26px color-mix(in srgb,var(--accent) 15%,transparent);touch-action:none}.side{width:78px;display:flex;flex-direction:column;gap:10px}.card{text-align:center;padding:9px 3px}.card canvas{width:62px;height:48px;display:block;margin:5px auto 0}.card b{display:block;margin-top:7px;font-size:18px}.card .speed{font-size:13px;color:var(--accent)}#hold{width:100%;color:white}.controls{display:flex;gap:7px;margin-top:auto}.controls button{flex:1;min-width:0;height:61px;background:#ffffff14;color:white;border:1px solid #ffffff28;border-radius:14px;font-size:19px;font-weight:800;touch-action:manipulation}.controls small{display:block;font-size:9px;letter-spacing:.4px;margin-top:4px}.controls .drop{background:var(--accent);color:#080b13}.hint{text-align:center;color:#788397;font-size:10px}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:3}.overlay.show{display:grid}.modal{background:#202537;border:1px solid #ffffff33;border-radius:24px;padding:27px;text-align:center;width:min(320px,100%)}.modal h2{letter-spacing:2px;font-size:15px;color:var(--accent)}.modal .big{font-size:48px;font-weight:900;margin:10px}.modal button{border:0;border-radius:100px;padding:14px 25px;background:var(--accent);color:#080b13;font-weight:900;width:100%}@media(max-height:650px){.app{gap:7px}.controls button{height:48px}.card{padding:6px 2px}.side{gap:6px}.brand strong{font-size:17px}.hint{display:none}}
</style></head><body><main class="app" id="app" style="--accent:#33e0b2"><div class="top"><div class="brand"><strong>TETRA LUX</strong><div class="sub" id="level">LVL 1 • CHILL</div></div><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div><button class="pause" id="pause" aria-label="Pause">Ⅱ</button></div><div class="tiers" id="tiers"></div><div class="arena"><div class="boardwrap"><canvas id="board" width="300" height="600" aria-label="Game board"></canvas></div><div class="side"><div class="card"><small>NEXT</small><canvas id="next" width="62" height="48"></canvas></div><button class="card" id="hold"><small>HOLD</small><canvas id="held" width="62" height="48"></canvas></button><div class="card"><small>LINES</small><b id="lines">0</b></div><div class="card"><small>SPEED</small><b class="speed" id="speed">1.10s</b></div></div></div><div class="controls"><button data-act="left">←<small>LEFT</small></button><button data-act="soft">↓<small>SOFT</small></button><button class="drop" data-act="drop">⇩<small>DROP</small></button><button data-act="rotate">↻<small>ROTATE</small></button><button data-act="right">→<small>RIGHT</small></button></div><div class="hint">Tap board to rotate · Swipe sideways to move · Swipe down to drop</div></main><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">SESSION COMPLETE</h2><div class="big" id="finalScore">0</div><p id="summary"></p><button id="restart">PLAY AGAIN</button></div></div><script>
(()=>{'use strict';const C=10,R=20,types=['I','O','T','S','Z','J','L'],colors={I:'#00efff',O:'#ffdb26',T:'#c252ff',S:'#1ff58e',Z:'#ff3d7a',J:'#388aff',L:'#ff8524'},shapes={I:[[-1,0],[0,0],[1,0],[2,0]],O:[[0,0],[1,0],[0,1],[1,1]],T:[[-1,0],[0,0],[1,0],[0,1]],S:[[0,0],[1,0],[-1,1],[0,1]],Z:[[-1,0],[0,0],[0,1],[1,1]],J:[[-1,1],[-1,0],[0,0],[1,0]],L:[[1,1],[-1,0],[0,0],[1,0]]};const tiers=[['CHILL',1,'#33e0b2'],['EASY',3,'#40adff'],['NORMAL',6,'#ae6bff'],['HARD',10,'#ff8c33'],['MASTER',14,'#ff3973']];const $=id=>document.getElementById(id),ctx=$('board').getContext('2d');let board,piece,next,held,canHold,bag,score,lines,level,start,timer,paused,over,best=Number(localStorage.getItem('tetraLuxBest')||0);$('best').textContent=best;function tier(){return level<3?0:level<6?1:level<10?2:level<14?3:4}function speed(){return Math.max(.1,1.1*Math.pow(.84,level-1))}function drawBag(){if(!bag.length){bag=[...types];for(let i=bag.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()}function make(t){return{t,x:4,y:0,b:shapes[t].map(p=>[...p])}}function valid(p){return p.b.every(([x,y])=>{let a=p.x+x,b=p.y+y;return a>=0&&a<C&&b<R&&(b<0||!board[b][a])})}function spawn(){piece=make(next);next=drawBag();canHold=true;if(!valid(piece)){over=true;stop();show('SESSION COMPLETE')}}function stop(){clearInterval(timer);timer=null}function schedule(){stop();if(!paused&&!over)timer=setInterval(()=>step(false),speed()*1000)}function newGame(i=start||0){start=i;board=Array.from({length:R},()=>Array(C).fill(null));bag=[];score=0;lines=0;level=tiers[i][1];held=null;canHold=true;paused=false;over=false;next=drawBag();spawn();$('overlay').classList.remove('show');schedule();update()}function move(dx){if(paused||over)return;let p={...piece,x:piece.x+dx};if(valid(p)){piece=p;vibrate(8);update()}}function rotate(){if(paused||over)return;if(piece.t==='O')return;let b=piece.b.map(([x,y])=>[-y,x]);for(let dx of [0,-1,1,-2,2]){let p={...piece,x:piece.x+dx,b};if(valid(p)){piece=p;vibrate(10);update();return}}}function step(bonus){if(paused||over)return;let p={...piece,y:piece.y+1};if(valid(p)){piece=p;if(bonus)score++;update()}else lock()}function drop(){if(paused||over)return;let d=0;while(valid({...piece,y:piece.y+1})){piece={...piece,y:piece.y+1};d++}score+=d*2;vibrate(25);lock()}function hold(){if(!canHold||paused||over)return;let old=piece.t;if(held){piece=make(held);held=old;if(!valid(piece)){over=true;stop();show('SESSION COMPLETE')}}else{held=old;spawn()}canHold=false;update()}function lock(){let topped=false;for(let[x,y]of piece.b){let a=piece.x+x,b=piece.y+y;if(b<0)topped=true;else if(b<R&&a>=0&&a<C)board[b][a]=piece.t}if(topped){over=true;stop();show('SESSION COMPLETE');update();return}let remaining=board.filter(row=>row.some(v=>!v)),cleared=R-remaining.length;if(cleared){board=[...Array.from({length:cleared},()=>Array(C).fill(null)),...remaining];score+=([0,100,300,500,800][cleared]||800)*level;lines+=cleared;let newLevel=tiers[start][1]+Math.floor(lines/10);if(newLevel!==level){level=newLevel;schedule()}vibrate(35)}saveBest();spawn();update()}function saveBest(){if(score>best){best=score;localStorage.setItem('tetraLuxBest',String(best))}}function vibrate(ms){if(navigator.vibrate)navigator.vibrate(ms)}function show(title){saveBest();$('modalTitle').textContent=title;$('finalScore').textContent=score;$('summary').textContent=`Level ${level} · ${lines} lines · Best ${best}`;$('overlay').classList.add('show')}function cell(c,x,y,color,ghost=false,s=30){let px=x*s,py=y*s;c.beginPath();c.roundRect(px+1,py+1,s-2,s-2,4);if(ghost){c.strokeStyle=color+'99';c.lineWidth=1.5;c.stroke()}else{c.fillStyle=color;c.fill();c.beginPath();c.roundRect(px+3,py+3,s-6,s-6,3);c.strokeStyle='#ffffff80';c.lineWidth=1.3;c.stroke()}}function mini(id,t){let c=$(id).getContext('2d');c.clearRect(0,0,62,48);if(!t)return;let b=shapes[t],minX=Math.min(...b.map(p=>p[0])),maxX=Math.max(...b.map(p=>p[0])),minY=Math.min(...b.map(p=>p[1])),maxY=Math.max(...b.map(p=>p[1])),s=12,ox=(62-(maxX-minX+1)*s)/2,oy=(48-(maxY-minY+1)*s)/2;b.forEach(([x,y])=>{c.fillStyle=colors[t];c.fillRect(ox+(x-minX)*s+1,oy+(y-minY)*s+1,s-2,s-2)})}function render(){ctx.clearRect(0,0,300,600);for(let y=0;y<R;y++)for(let x=0;x<C;x++){ctx.strokeStyle='#ffffff0b';ctx.strokeRect(x*30+.5,y*30+.5,29,29);if(board[y][x])cell(ctx,x,y,colors[board[y][x]])}if(piece){let gy=piece.y;while(valid({...piece,y:gy+1}))gy++;piece.b.forEach(([x,y])=>{let a=piece.x+x,b=gy+y;if(b>=0&&b<R)cell(ctx,a,b,colors[piece.t],true)});piece.b.forEach(([x,y])=>{let a=piece.x+x,b=piece.y+y;if(b>=0&&b<R)cell(ctx,a,b,colors[piece.t])})}mini('next',next);mini('held',held)}function update(){saveBest();let t=tier();$('app').style.setProperty('--accent',tiers[t][2]);$('level').textContent=`LVL ${level} • ${tiers[t][0]}`;$('score').textContent=score;$('best').textContent=best;$('lines').textContent=lines;$('speed').textContent=speed().toFixed(2)+'s';$('pause').textContent=paused?'▶':'Ⅱ';$('hold').style.opacity=canHold?1:.45;[...$('tiers').children].forEach((b,i)=>b.classList.toggle('selected',i===start));render()}tiers.forEach(([name],i)=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>{if(score&&!over&&!confirm('Start a new game? Current progress will be lost.'))return;newGame(i)};$('tiers').append(b)});const actions={left:()=>move(-1),right:()=>move(1),soft:()=>step(true),drop,rotate};document.querySelectorAll('[data-act]').forEach(b=>{let act=actions[b.dataset.act],repeat=null,delay=null;const clear=()=>{clearTimeout(delay);clearInterval(repeat);delay=repeat=null};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);act();if(['left','right','soft'].includes(b.dataset.act))delay=setTimeout(()=>repeat=setInterval(act,75),220)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,clear))});$('hold').onclick=hold;$('pause').onclick=()=>{if(over)return;paused=!paused;schedule();update();if(paused)show('PAUSED');else $('overlay').classList.remove('show')};$('restart').onclick=()=>{if(paused&&!over){paused=false;$('overlay').classList.remove('show');schedule();update()}else newGame(start)};let touch=null;$('board').addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY}});$('board').addEventListener('pointerup',e=>{if(!touch)return;let dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.abs(dx)<18&&Math.abs(dy)<18)rotate();else if(Math.abs(dx)>Math.abs(dy)){let count=Math.min(6,Math.max(1,Math.round(Math.abs(dx)/28)));for(let i=0;i<count;i++)move(dx>0?1:-1)}else if(dy>70)drop();else if(dy>18)step(true)});window.addEventListener('keydown',e=>{let map={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'soft',ArrowUp:'rotate',' ':'drop'};if(map[e.key]){e.preventDefault();actions[map[e.key]]()}else if(e.key.toLowerCase()==='c')hold();else if(e.key.toLowerCase()==='p')$('pause').click()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&!over){paused=true;schedule();update();show('PAUSED')}});newGame(0);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
